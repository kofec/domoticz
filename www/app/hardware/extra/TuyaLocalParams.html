<table class="display" id="hardwareparamstuyalocal" border="0" cellpadding="0" cellspacing="20">
	<tr><td colspan="2"><span data-i18n="Connect TinyTuya to the Tuya IoT Cloud account. Devices from the account are discovered using the Search DeviceID.">Connect TinyTuya to the Tuya IoT Cloud account. Devices from the account are discovered using the Search DeviceID.</span></td></tr>
	<tr valign="top">
		<td align="right" style="width:150px"><label for="tuyalocalregion"><span data-i18n="Region">Region</span>:</label></td>
		<td><select id="tuyalocalregion" class="combobox ui-corner-all"><option value="0">EU</option><option value="1">US</option><option value="2">CN</option></select></td>
	</tr>
	<tr valign="top">
		<td align="right"><label for="tuyalocalsearch"><span data-i18n="Search DeviceID">Search DeviceID</span>:</label></td>
		<td><input type="text" id="tuyalocalsearch" style="width:300px"></td>
	</tr>
	<tr valign="top">
		<td align="right"><label for="tuyalocalcloudpoll"><span data-i18n="API Polling interval">API Polling interval</span>:</label></td>
		<td><select id="tuyalocalcloudpoll" class="combobox ui-corner-all"><option value="60">1 minute</option><option value="300">5 minutes</option><option value="600">10 minutes</option><option value="900">15 minutes</option><option value="1800">30 minutes</option></select></td>
	</tr>
	<tr valign="top">
		<td align="right"><label for="tuyalocallan"><span data-i18n="Local connection (LAN)">Local connection (LAN)</span>:</label></td>
		<td><select id="tuyalocallan" class="combobox ui-corner-all"><option value="0">Off</option><option value="60">On, full refresh 1 minute</option><option value="120">On, full refresh 2 minutes</option><option value="300">On, full refresh 5 minutes</option><option value="600">On, full refresh 10 minutes</option></select></td>
	</tr>
	<tr valign="top">
		<td align="right"><label for="tuyalocalrefresh"><span data-i18n="Refresh button for device IDs">Refresh button for device IDs</span>:</label></td>
		<td><input type="text" id="tuyalocalrefresh" style="width:300px"><br><span data-i18n="Comma-separated device IDs">Comma-separated device IDs</span></td>
	</tr>
	<tr valign="top">
		<td align="right"><label for="tuyalocaldebug"><span data-i18n="Debug">Debug</span>:</label></td>
		<td><select id="tuyalocaldebug" class="combobox ui-corner-all"><option value="0">None</option><option value="1">Errors</option><option value="2">Info</option><option value="3">Status</option><option value="4">All</option></select></td>
	</tr>
</table>
